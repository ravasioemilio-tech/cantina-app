<meta name="apple-mobile-web-app-capable" content="yes">

<meta name="application-name" content="La Cantina">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --parchment:#F6F1E6;
    --parchment-deep:#EFE7D6;
    --ink:#2B2119;
    --ink-soft:#5A4B3E;
    --rosso:#6B1E2B;
    --rosso-soft:#F0DCDD;
    --bianco:#A6822B;
    --bianco-soft:#F3ECD3;
    --rosato:#B9636E;
    --rosato-soft:#F5DEE1;
    --frizzante:#5D7A5F;
    --frizzante-soft:#DEE8DB;
    --line:#DDD1B8;
    --gold:#A6822B;
    --shadow: 0 1px 0 rgba(43,33,25,0.06);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--parchment);
    color:var(--ink);
    font-family:'Work Sans', sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:720px;margin:0 auto;padding:0 18px 60px;}

  header{
    padding:36px 18px 22px;
    text-align:center;
    border-bottom:1px solid var(--line);
    margin-bottom:18px;
  }
  header .crest{
    width:34px;height:34px;margin:0 auto 14px;
    opacity:0.75;
  }
  h1{
    font-family:'Cormorant Garamond', serif;
    font-weight:600;
    font-size:2.6rem;
    margin:0 0 6px;
    letter-spacing:0.01em;
  }
  header p{
    margin:0;
    color:var(--ink-soft);
    font-size:0.95rem;
    font-style:italic;
    font-family:'Cormorant Garamond', serif;
  }
  .count-line{
    text-align:center;
    font-size:0.8rem;
    color:var(--ink-soft);
    margin:12px 0 20px;
    letter-spacing:0.02em;
  }
  .backup-row{
    display:flex;
    justify-content:center;
    gap:16px;
    margin:-8px 0 18px;
  }
  .backup-link{
    font-size:0.75rem;
    color:var(--ink-soft);
    text-decoration:underline;
    cursor:pointer;
    background:none;
    border:none;
    font-family:'Work Sans', sans-serif;
    padding:0;
  }
  .backup-toast{
    position:fixed;
    bottom:24px;
    left:50%;
    transform:translateX(-50%);
    background:var(--ink);
    color:var(--parchment);
    padding:10px 18px;
    border-radius:20px;
    font-size:0.82rem;
    opacity:0;
    pointer-events:none;
    transition:opacity 0.25s;
    z-index:200;
  }
  .backup-toast.show{opacity:1;}
  .import-banner{
    display:none;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    background:var(--parchment-deep);
    border:1px solid var(--line);
    border-radius:8px;
    padding:10px 12px;
    margin:0 0 16px;
    font-size:0.82rem;
  }
  .import-banner.show{display:flex;}
  .import-banner .msg{flex:1;}
  .import-banner .actions{display:flex; gap:8px; flex-shrink:0;}
  .import-banner button{
    border:none;
    background:none;
    font-family:'Work Sans', sans-serif;
    font-size:0.78rem;
    cursor:pointer;
    padding:5px 10px;
    border-radius:14px;
  }
  .import-banner .btn-yes{background:var(--ink); color:var(--parchment);}
  .import-banner .btn-no{color:var(--ink-soft);}

  .ais-toggle{
    margin-top:18px;
    width:100%;
    padding:11px;
    border-radius:6px;
    border:1px dashed var(--line);
    background:none;
    color:var(--ink-soft);
    font-family:'Work Sans', sans-serif;
    font-size:0.82rem;
    cursor:pointer;
    text-align:left;
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  .ais-body{
    display:none;
    margin-top:10px;
    padding:14px;
    background:#fff;
    border:1px solid var(--line);
    border-radius:8px;
  }
  .ais-body.open{display:block;}
  .ais-section-title{
    font-family:'Cormorant Garamond', serif;
    font-weight:600;
    font-size:1.05rem;
    margin:14px 0 8px;
    color:var(--rosso);
  }
  .ais-section-title:first-child{margin-top:0;}
  .ais-field{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    padding:6px 0;
  }
  .ais-field label{
    font-size:0.8rem;
    color:var(--ink-soft);
    flex-shrink:0;
  }
  .ais-field select{
    flex:1;
    max-width:60%;
    font-size:0.8rem;
    padding:5px 8px;
    border-radius:14px;
  }
  .ais-descrittori{
    margin-top:8px;
  }
  .ais-descrittori input{
    width:100%;
    padding:8px 10px;
    border:1px solid var(--line);
    border-radius:6px;
    font-size:0.85rem;
    font-family:'Work Sans', sans-serif;
  }
  .ais-punteggio{
    display:flex;
    align-items:center;
    gap:10px;
    margin-top:10px;
  }
  .ais-punteggio input{
    width:70px;
    padding:6px 8px;
    border:1px solid var(--line);
    border-radius:6px;
    text-align:center;
    font-size:0.95rem;
  }

  .controls{
    position:sticky;
    top:0;
    background:var(--parchment);
    padding:12px 0 14px;
    z-index:10;
    border-bottom:1px solid var(--line);
    margin-bottom:16px;
  }
  .search-row{
    display:flex;
    gap:8px;
  }
  input[type="text"]{
    flex:1;
    padding:11px 14px;
    border:1px solid var(--line);
    border-radius:3px;
    background:#fff;
    font-family:'Work Sans', sans-serif;
    font-size:0.95rem;
    color:var(--ink);
  }
  input[type="text"]:focus{
    outline:none;
    border-color:var(--rosso);
  }
  .filter-chips{
    display:flex;
    gap:7px;
    flex-wrap:wrap;
    margin-top:10px;
  }
  .chip{
    padding:6px 13px;
    border-radius:20px;
    border:1px solid var(--line);
    background:#fff;
    font-size:0.78rem;
    color:var(--ink-soft);
    cursor:pointer;
    user-select:none;
    transition:background 0.15s, color 0.15s, border-color 0.15s;
    white-space:nowrap;
  }
  .chip.active{
    background:var(--ink);
    border-color:var(--ink);
    color:var(--parchment);
  }
  select{
    padding:6px 10px;
    border-radius:20px;
    border:1px solid var(--line);
    background:#fff;
    font-size:0.78rem;
    color:var(--ink-soft);
    font-family:'Work Sans', sans-serif;
  }

  .grid{
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .card{
    background:#fff;
    border:1px solid var(--line);
    border-left-width:4px;
    padding:14px 16px 14px;
    box-shadow:var(--shadow);
    cursor:pointer;
    display:flex;
    gap:12px;
  }
  .card.rosso{border-left-color:var(--rosso);}
  .card.bianco{border-left-color:var(--bianco);}
  .card.rosato{border-left-color:var(--rosato);}
  .card.frizzante{border-left-color:var(--frizzante);}

  .card-thumb{
    width:46px;
    height:70px;
    object-fit:cover;
    border-radius:2px;
    flex-shrink:0;
    background:var(--parchment-deep);
  }
  .card-thumb.placeholder{
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--line);
    font-size:1.4rem;
  }
  .card-body{flex:1; min-width:0;}

  .card-top{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    gap:10px;
  }
  .card-name{
    font-family:'Cormorant Garamond', serif;
    font-weight:600;
    font-size:1.25rem;
    line-height:1.15;
  }
  .card-vintage{
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    font-size:1.05rem;
    color:var(--ink-soft);
    white-space:nowrap;
  }
  .card-producer{
    font-size:0.83rem;
    color:var(--ink-soft);
    margin-top:2px;
  }
  .card-meta{
    display:flex;
    flex-wrap:wrap;
    gap:6px 8px;
    margin-top:9px;
    font-size:0.7rem;
    color:var(--ink-soft);
  }
  .tag{
    padding:2px 9px;
    border-radius:20px;
    background:var(--parchment-deep);
  }
  .card.rosso .tag.type{background:var(--rosso-soft); color:var(--rosso);}
  .card.bianco .tag.type{background:var(--bianco-soft); color:#7A611F;}
  .card.rosato .tag.type{background:var(--rosato-soft); color:var(--rosato);}
  .card.frizzante .tag.type{background:var(--frizzante-soft); color:var(--frizzante);}
  .card-stars{
    color:var(--gold);
    font-size:0.78rem;
    letter-spacing:1px;
    margin-top:6px;
  }
  .qty-badge{
    font-size:0.68rem;
    padding:2px 8px;
    border-radius:20px;
    background:var(--parchment-deep);
    color:var(--ink-soft);
  }

  .empty{
    text-align:center;
    padding:50px 20px;
    color:var(--ink-soft);
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    font-size:1.1rem;
  }

  /* Detail overlay */
  .overlay{
    position:fixed;inset:0;
    background:rgba(43,33,25,0.5);
    display:flex;
    align-items:flex-end;
    z-index:100;
    opacity:0;
    pointer-events:none;
    transition:opacity 0.2s;
  }
  .overlay.open{opacity:1;pointer-events:auto;}
  .sheet{
    background:var(--parchment);
    width:100%;
    max-height:88vh;
    overflow-y:auto;
    border-radius:14px 14px 0 0;
    padding:22px 22px 32px;
    transform:translateY(20px);
    transition:transform 0.2s;
  }
  .overlay.open .sheet{transform:translateY(0);}
  .sheet-close{
    display:block;
    margin:0 auto 16px;
    width:36px;height:4px;
    background:var(--line);
    border-radius:3px;
    border:none;
  }
  .sheet-head{
    display:flex;
    gap:14px;
    margin-bottom:16px;
  }
  .sheet-img{
    width:80px;
    height:120px;
    object-fit:cover;
    border-radius:3px;
    flex-shrink:0;
    background:var(--parchment-deep);
  }
  .sheet h2{
    font-family:'Cormorant Garamond', serif;
    font-size:1.7rem;
    font-weight:600;
    margin:0 0 2px;
    line-height:1.15;
  }
  .sheet .sub{
    color:var(--ink-soft);
    font-size:0.88rem;
  }
  .detail-row{
    display:flex;
    justify-content:space-between;
    padding:10px 0;
    border-bottom:1px solid var(--line);
    font-size:0.88rem;
    gap:10px;
  }
  .detail-row .label{color:var(--ink-soft); white-space:nowrap;}
  .detail-row .value{text-align:right;}

  .stars-input{
    display:flex;
    gap:4px;
    font-size:1.5rem;
    cursor:pointer;
    line-height:1;
  }
  .stars-input span{color:var(--line); transition:color 0.1s;}
  .stars-input span.filled{color:var(--gold);}

  .field-block{margin-top:16px;}
  .field-block label{
    display:block;
    font-size:0.78rem;
    color:var(--ink-soft);
    margin-bottom:6px;
  }
  textarea, input[type="number"], input[type="text"].field-input{
    width:100%;
    padding:10px;
    border:1px solid var(--line);
    border-radius:6px;
    font-family:'Work Sans', sans-serif;
    font-size:0.88rem;
    background:#fff;
    color:var(--ink);
  }
  textarea{min-height:64px; resize:vertical;}
  .qty-row{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .qty-btn{
    width:34px;height:34px;
    border-radius:6px;
    border:1px solid var(--line);
    background:#fff;
    font-size:1.1rem;
    cursor:pointer;
    color:var(--ink);
  }
  .qty-row input{
    width:50px;
    text-align:center;
    padding:8px 4px;
    border:1px solid var(--line);
    border-radius:6px;
    font-size:0.95rem;
  }
  .price-row{display:flex; align-items:center; gap:6px;}
  .price-row span{color:var(--ink-soft);}
  .drink-btn{
    margin-top:18px;
    width:100%;
    padding:11px;
    border-radius:6px;
    border:1px solid var(--ink);
    background:transparent;
    color:var(--ink);
    font-family:'Work Sans', sans-serif;
    font-size:0.85rem;
    cursor:pointer;
  }
  .drink-btn.consumed{
    background:var(--ink);
    color:var(--parchment);
  }
  .consumed-badge{
    font-size:0.68rem;
    padding:2px 9px;
    border-radius:20px;
    background:var(--ink);
    color:var(--parchment);
  }
  .card.is-consumed{opacity:0.5;}

  .fab{
    position:fixed; right:18px; bottom:22px;
    width:56px; height:56px; border-radius:50%;
    background:var(--rosso); color:#fff; border:none;
    font-size:2rem; line-height:1; cursor:pointer; z-index:50;
    box-shadow:0 4px 14px rgba(43,33,25,0.35);
  }
  .photo-slots{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .photo-slot{
    border:1px dashed var(--line); border-radius:8px; padding:10px;
    text-align:center; font-size:0.78rem; color:var(--ink-soft); background:#fff;
  }
  .photo-slot img{width:100%; height:120px; object-fit:cover; border-radius:4px; margin-bottom:6px;}
  .slot-btns{display:flex; flex-direction:column; gap:6px; margin-top:8px;}
  .mini-btn{
    border:1px solid var(--line); background:var(--parchment); color:var(--ink);
    border-radius:14px; padding:6px 8px; font-size:0.78rem; cursor:pointer;
    font-family:'Work Sans', sans-serif;
  }
  .ocr-btn, .btn-primary{
    width:100%; margin-top:12px; padding:12px; border-radius:6px; border:none;
    background:var(--ink); color:var(--parchment); font-size:0.88rem; cursor:pointer;
    font-family:'Work Sans', sans-serif;
  }
  .btn-primary{background:var(--rosso); margin-top:20px;}
  .btn-secondary{
    width:100%; margin-top:8px; padding:11px; border-radius:6px;
    border:1px solid var(--line); background:transparent; color:var(--ink-soft);
    font-size:0.85rem; cursor:pointer; font-family:'Work Sans', sans-serif;
  }
  .ocr-status{font-size:0.78rem; color:var(--ink-soft); margin-top:8px; min-height:1em;}
  #fRaw{margin-top:8px; font-size:0.75rem; color:var(--ink-soft);}
  #fRaw pre{white-space:pre-wrap; background:#fff; border:1px solid var(--line); padding:8px; border-radius:6px; max-height:140px; overflow:auto;}
  .field-block select{
    width:100%; padding:10px; border-radius:6px; font-size:0.88rem; background:#fff; color:var(--ink);
  }
  .custom-actions{display:flex; justify-content:space-between; margin-top:14px;}
  .link-btn{background:none; border:none; font-size:0.8rem; color:var(--ink-soft); text-decoration:underline; cursor:pointer; font-family:'Work Sans', sans-serif;}
  .link-btn.danger{color:var(--rosso);}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <svg class="crest" viewBox="0 0 24 24" fill="none" stroke="#2B2119" stroke-width="1.2">
      <path d="M12 2c0 4-3 5-3 9a3 3 0 0 0 6 0c0-4-3-5-3-9z"/>
      <path d="M12 14v8"/>
      <path d="M8 22h8"/>
    </svg>
    <h1>La Cantina</h1>
    <p>Fotovoltaico Consulting &mdash; Bonate Sotto</p>
  </header>

  <div class="count-line" id="countLine"></div>
  <div class="backup-row">
    <button class="backup-link" id="exportBtn">Esporta backup</button>
    <button class="backup-link" id="importBtn">Importa backup</button>
    <input type="file" id="importFile" accept="application/json" style="display:none;">
  </div>

  <div class="controls">
    <div class="search-row">
      <input type="text" id="searchInput" placeholder="Cerca per nome, produttore, zona...">
    </div>
    <div class="filter-chips" id="typeChips"></div>
    <div class="filter-chips">
      <select id="regionSelect"><option value="">Tutte le regioni/zone</option></select>
    </div>
  </div>

  <div class="import-banner" id="importBanner">
    <span class="msg">Hai un backup salvato da importare?</span>
    <div class="actions">
      <button class="btn-yes" id="bannerYes">Importa</button>
      <button class="btn-no" id="bannerNo">No</button>
    </div>
  </div>

  <div class="grid" id="grid"></div>
  <div class="empty" id="emptyMsg" style="display:none;">Nessun vino corrisponde alla ricerca.</div>
</div>
<button class="fab" id="addWineBtn" aria-label="Aggiungi vino">+</button>
<div class="backup-toast" id="backupToast"></div>

<div class="overlay" id="overlay">
  <div class="sheet" id="sheet"></div>
</div>

const TYPE_LABELS = {rosso:"Rosso", bianco:"Bianco", rosato:"Rosato", frizzante:"Frizzante"};

const AIS_COLORI = {
  rosso: ["Porpora","Rubino","Rubino granato","Granato","Aranciato"],
  bianco: ["Verdolino","Paglierino","Dorato","Ambrato"],
  rosato: ["Buccia di cipolla","Rosa tenue","Cerasuolo","Chiaretto"],
  frizzante: ["Verdolino","Paglierino","Dorato","Ambrato"]
};
const AIS_LIMPIDEZZA = ["Limpido","Velato","Torbido"];
const AIS_CONSISTENZA = ["Fluido","Poco consistente","Abbastanza consistente","Consistente","Viscoso"];
const AIS_INTENSITA = ["Carente","Poco intenso","Abbastanza intenso","Intenso","Molto intenso"];
const AIS_COMPLESSITA = ["Poco complesso","Abbastanza complesso","Complesso","Molto complesso"];
const AIS_QUALITA = ["Poco gradevole","Abbastanza fine","Fine","Eccellente"];
const AIS_DOLCEZZA = ["Secco","Abboccato","Amabile","Dolce"];
const AIS_MORBIDEZZA = ["Poco morbido","Morbido","Equilibrato","Caldo"];
const AIS_FRESCHEZZA = ["Poco fresco","Fresco","Molto fresco"];
const AIS_SAPIDITA = ["Poco sapido","Sapido","Molto sapido"];
const AIS_TANNINO = ["Poco tannico","Tannico","Astringente"];
const AIS_CORPO = ["Leggero","Abbastanza corposo","Corposo","Robusto"];

function aisSelect(id, options, current){
  return `<select id="${id}"><option value="">—</option>${options.map(o=>`<option value="${o}"${current===o?' selected':''}>${o}</option>`).join('')}</select>`;
}

let activeType = "";
let activeRegion = "";
let searchTerm = "";
let userData = {}; // { id: {notes, consumed, rating, quantity, price, provenance} }
let customWines = []; // vini aggiunti dall'utente
function allWines(){ return WINES.concat(customWines); }
function wineImg(w){ return w.img || IMAGES[w.id]; }

function getUD(id){
  if(!userData[id]) userData[id] = {};
  if(userData[id].quantity === undefined) userData[id].quantity = 1;
  return userData[id];
}

function loadUserData(){
  try{
    const raw = localStorage.getItem('cantina-user-data');
    if(raw){ userData = JSON.parse(raw); }
  }catch(e){ console.error('Impossibile leggere i dati salvati', e); }
  try{
    const rc = localStorage.getItem('cantina-custom-wines');
    if(rc){ customWines = JSON.parse(rc); }
  }catch(e){ console.error('Impossibile leggere i vini aggiunti', e); }
  refreshRegionOptions();
  render();
}

let hasUnexportedChanges = false;

function saveUserData(){
  try{
    localStorage.setItem('cantina-user-data', JSON.stringify(userData));
    hasUnexportedChanges = true;
  }catch(e){ console.error('Impossibile salvare i dati', e); }
}

function refreshRegionOptions(){
  const sel = document.getElementById('regionSelect');
  const regions = [...new Set(allWines().map(w=>w.region).filter(Boolean))].sort();
  const current = sel.value;
  sel.innerHTML = '<option value="">Tutte le regioni/zone</option>';
  regions.forEach(r=>{
    const opt = document.createElement('option');
    opt.value = r; opt.textContent = r;
    sel.appendChild(opt);
  });
  sel.value = regions.includes(current) ? current : '';
  activeRegion = sel.value;
}

function populateRegionSelect(){
  refreshRegionOptions();
  document.getElementById('regionSelect').addEventListener('change', e=>{ activeRegion = e.target.value; render(); });
}

function populateTypeChips(){
  const wrap = document.getElementById('typeChips');
  const all = document.createElement('div');
  all.className = 'chip active';
  all.textContent = 'Tutti';
  all.dataset.type = '';
  wrap.appendChild(all);
  Object.entries(TYPE_LABELS).forEach(([key,label])=>{
    const chip = document.createElement('div');
    chip.className = 'chip';
    chip.textContent = label;
    chip.dataset.type = key;
    wrap.appendChild(chip);
  });
  wrap.addEventListener('click', e=>{
    if(!e.target.classList.contains('chip')) return;
    [...wrap.children].forEach(c=>c.classList.remove('active'));
    e.target.classList.add('active');
    activeType = e.target.dataset.type;
    render();
  });
}

function matches(wine){
  if(activeType && wine.type !== activeType) return false;
  if(activeRegion && wine.region !== activeRegion) return false;
  if(searchTerm){
    const hay = (wine.name+' '+wine.producer+' '+wine.denom+' '+wine.region).toLowerCase();
    if(!hay.includes(searchTerm.toLowerCase())) return false;
  }
  return true;
}

function starString(rating){
  rating = rating || 0;
  let s = '';
  for(let i=1;i<=5;i++){ s += (i<=rating ? '★' : '☆'); }
  return s;
}

function render(){
  const grid = document.getElementById('grid');
  const empty = document.getElementById('emptyMsg');
  const filtered = allWines().filter(matches);
  document.getElementById('countLine').textContent = `${filtered.length} di ${allWines().length} bottiglie`;
  grid.innerHTML = '';
  if(filtered.length === 0){
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';
  filtered.forEach(w=>{
    const ud = getUD(w.id);
    const card = document.createElement('div');
    card.className = `card ${w.type}` + (ud.consumed ? ' is-consumed' : '');
    const img = wineImg(w);
    const thumb = img
      ? `<img class="card-thumb" src="data:image/jpeg;base64,${img}" alt="Etichetta ${w.name}">`
      : `<div class="card-thumb placeholder">🍷</div>`;
    card.innerHTML = `
      ${thumb}
      <div class="card-body">
        <div class="card-top">
          <div class="card-name">${w.name}</div>
          ${w.vintage ? `<div class="card-vintage">${w.vintage}</div>` : ''}
        </div>
        <div class="card-producer">${w.producer}</div>
        <div class="card-meta">
          <span class="tag type">${TYPE_LABELS[w.type]}</span>
          ${w.region ? `<span class="tag">${w.region}</span>` : ''}
          ${ud.quantity > 1 ? `<span class="qty-badge">×${ud.quantity}</span>` : ''}
          ${ud.consumed ? '<span class="consumed-badge">Bevuta</span>' : ''}
        </div>
        ${ud.rating ? `<div class="card-stars">${starString(ud.rating)}</div>` : ''}
      </div>
    `;
    card.addEventListener('click', ()=>openDetail(w.id));
    grid.appendChild(card);
  });
}

let formImg = null;
let formCanvases = {front:null, back:null};

function escAttr(v){
  return String(v==null?'':v).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function loadImageFromFile(file){
  return new Promise((res, rej)=>{
    const r = new FileReader();
    r.onload = e=>{
      const im = new Image();
      im.onload = ()=>res(im);
      im.onerror = rej;
      im.src = e.target.result;
    };
    r.onerror = rej;
    r.readAsDataURL(file);
  });
}

function scaleToCanvas(im, maxSide){
  const k = Math.min(1, maxSide / Math.max(im.width, im.height));
  const c = document.createElement('canvas');
  c.width = Math.round(im.width * k);
  c.height = Math.round(im.height * k);
  c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
  return c;
}

function openAddForm(editId){

    <div class="ocr-status" id="fOcrStatus">Puoi anche saltare e compilare tutto a mano.</div>
    <details id="fRaw"><summary>Testo letto dall'etichetta</summary><pre id="fRawText"></pre></details>

    <div class="field-block"><label>Nome del vino *</label><input type="text" class="field-input" id="fName" value="${escAttr(w.name)}"></div>
    <div class="field-block"><label>Produttore</label><input type="text" class="field-input" id="fProducer" value="${escAttr(w.producer==='—'?'':w.producer)}"></div>

  `;
  sheet.scrollTop = 0;
  document.getElementById('overlay').classList.add('open');

  const bindPhoto = (key, slotName)=>{
    const prev = document.getElementById(`f${key}Prev`);
    ['Cam','Gal'].forEach(kind=>{
      const inp = document.getElementById(`f${key}${kind}`);
      document.getElementById(`f${key}${kind}Btn`).addEventListener('click', ()=>inp.click());
      inp.addEventListener('change', async ()=>{
        const f = inp.files && inp.files[0];
        if(!f) return;
        try{
          const im = await loadImageFromFile(f);
          formCanvases[slotName] = scaleToCanvas(im, 1800);
          const thumb = scaleToCanvas(im, 480).toDataURL('image/jpeg', 0.62);
          prev.src = thumb; prev.style.display = 'block';
          if(slotName === 'front') formImg = thumb.split(',')[1];
        }catch(e){ showToast('Foto non leggibile'); }
        inp.value = '';
      });
    });
  };
  bindPhoto('Front', 'front');
  bindPhoto('Back', 'back');

  document.getElementById('fOcrBtn').addEventListener('click', runOcr);
  document.getElementById('fSaveBtn').addEventListener('click', ()=>saveWineFromForm(editing ? editing.id : null));
  document.getElementById('fCancelBtn').addEventListener('click', ()=>{
    if(editing){ openDetail(editing.id); } else { closeDetail(); }
  });
}

function loadTesseract(){
  return new Promise((res, rej)=>{
    if(window.Tesseract) return res();
    const sc = document.createElement('script');
    sc.src = 'https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';
    sc.onload = res; sc.onerror = rej;
    document.head.appendChild(sc);
  });
}

async function runOcr(){
  const status = document.getElementById('fOcrStatus');
  const canvases = [formCanvases.front, formCanvases.back].filter(Boolean);
  if(!canvases.length){
    status.textContent = 'Prima scatta o scegli almeno una foto dell\'etichetta.';
    return;
  }
  try{
    status.textContent = 'Carico il lettore di testo (serve internet, la prima volta ci mette un po\')…';
    await loadTesseract();
    let fullText = '';
    for(let i=0;i<canvases.length;i++){
      const r = await Tesseract.recognize(canvases[i], 'ita+eng', {
        logger: m=>{
          if(m.status === 'recognizing text'){
            status.textContent = `Lettura foto ${i+1} di ${canvases.length}… ${Math.round(m.progress*100)}%`;
          }
        }
      });
      fullText += '\n' + r.data.text;
    }
    const parsed = parseLabel(fullText);
    const setIfEmpty = (id, val)=>{
      const el = document.getElementById(id);
      if(el && val && !String(el.value).trim()) el.value = val;
    };
    setIfEmpty('fName', parsed.name);
    setIfEmpty('fProducer', parsed.producer);
    setIfEmpty('fDenom', parsed.denom);
    setIfEmpty('fVintage', parsed.vintage);
    setIfEmpty('fAbv', parsed.abv);
    setIfEmpty('fGrapes', parsed.grapes);
    if(parsed.type) document.getElementById('fType').value = parsed.type;
    document.getElementById('fRawText').textContent = fullText.trim();
    document.getElementById('fRaw').style.display = 'block';
    status.textContent = 'Fatto. Controlla i campi compilati e correggi dove serve: la lettura automatica può sbagliare.';
  }catch(e){
    console.error(e);
    status.textContent = 'Lettura automatica non riuscita (serve la connessione a internet). Puoi compilare a mano.';
  }
}

function tidy(s){
  s = String(s).trim();
  if(s === s.toUpperCase() && /[A-Z]/.test(s)){
    s = s.toLowerCase().replace(/(^|[\s'’-])([a-zà-ÿ])/g, (m,a,b)=>a+b.toUpperCase());
    s = s.replace(/\b(Docg|Doc|Igt|Igp|Aoc|Srl|Spa|Sas)\b/g, x=>x.toUpperCase());
  }
  return s;
}

const KNOWN_GRAPES = ['Sangiovese','Nebbiolo','Barbera','Dolcetto','Merlot','Cabernet Sauvignon','Cabernet Franc','Syrah','Primitivo','Negroamaro','Montepulciano','Corvina','Corvinone','Rondinella','Nero d\'Avola','Cannonau','Aglianico','Sagrantino','Teroldego','Lagrein','Lambrusco','Chardonnay','Pinot Nero','Pinot Grigio','Pinot Bianco','Sauvignon','Vermentino','Verdicchio','Trebbiano','Glera','Riesling','Arneis','Garganega','Vernaccia','Fiano','Greco','Falanghina','Gewürztraminer','Cortese','Moscato','Malvasia','Nerello Mascalese','Grillo','Catarratto','Inzolia','Pecorino','Passerina'];

function parseLabel(text){
  const out = {};
  const lines = text.split(/\n+/).map(l=>l.replace(/[|_~•]/g,' ').replace(/\s+/g,' ').trim()).filter(l=>l.length>2);
  const low = text.toLowerCase();

  const thisYear = new Date().getFullYear();
  const years = (text.match(/\b(19[6-9]\d|20[0-3]\d)\b/g)||[]).map(Number).filter(y=>y<=thisYear);
  if(years.length) out.vintage = years[0];

  let m = text.match(/(\d{1,2}(?:[.,]\d)?)\s*%\s*(?:vol|alc)/i) || text.match(/(?:alc\.?|vol\.?)\s*(\d{1,2}(?:[.,]\d)?)\s*%/i);
  if(!m){
    const all = [...text.matchAll(/(\d{1,2}(?:[.,]\d)?)\s*%/g)].filter(x=>{ const v=parseFloat(x[1].replace(',','.')); return v>=5 && v<=20; });
    if(all.length) m = all[0];
  }
  if(m){
    const v = parseFloat(m[1].replace(',','.'));
    if(v>=5 && v<=20) out.abv = String(m[1]).replace('.',',') + '%';
  }

  const di = lines.findIndex(l=>/denominazione di origine controllata/i.test(l));
  if(di >= 0){
    const garantita = /garantita/i.test(lines[di] + ' ' + (lines[di+1]||''));
    const prev = lines[di-1] || '';
    if(prev && prev.length <= 45 && !/(contiene|imbottigliat|prodott)/i.test(prev)){
      out.denom = tidy(prev) + ' ' + (garantita ? 'DOCG' : 'DOC');
    }
  }
  if(!out.denom){
    const l = lines.find(l=>/\b(DOCG|DOC|IGT|IGP|AOC)\b/.test(l) && l.length <= 60);
    if(l) out.denom = tidy(l);
  }

  const pi = lines.findIndex(l=>/imbottigliat[oa]|bottled by|mis en bouteille/i.test(l));
  if(pi >= 0){
    let rest = lines[pi].replace(/.*?(?:imbottigliat[oa](?:\s+all['’]origine)?(?:\s+da)?|bottled by|mis en bouteille(?: par)?)\s*:?/i, '').trim();
    if(rest.length < 4) rest = (lines[pi+1]||'').trim();
    rest = rest.replace(/\s*[-–]\s*(italia|italy).*$/i, '');
    if(rest.length >= 3 && rest.length <= 60) out.producer = tidy(rest);
  }

  const bad = /(contiene|solfiti|sulphites|sulfites|imbottigliat|prodott|product of|denominazione|origine|controllata|garantita|\bvol\b|\bml\b|\bcl\b|www\.|\.it\b|\.com\b|\balc\b|italia|italy|temperatura|abbinament|bottled|kcal|\bkj\b|€|\d{4,})/i;
  const cand = lines.slice(0,12).find(l=>
    l.length>=4 && l.length<=40 &&
    (l.match(/[A-Za-zÀ-ÿ]/g)||[]).length >= l.length*0.7 &&
    !bad.test(l) && l !== out.denom
  );
  if(cand) out.name = tidy(cand);

  if(/spumante|frizzante|prosecco|franciacorta|metodo classico|champagne|\bbrut\b/.test(low)) out.type = 'frizzante';
  else if(/ros[ée](?![a-z])|rosato|chiaretto|cerasuolo/.test(low)) out.type = 'rosato';
  else if(/vino bianco|\bbianco\b|chardonnay|arneis|vermentino|riesling|sauvignon|pinot grigio|verdicchio|vernaccia|fiano|falanghina|garganega|\bsoave\b|lugana/.test(low)) out.type = 'bianco';
  else out.type = 'rosso';

  const found = KNOWN_GRAPES.filter(g=>low.includes(g.toLowerCase()));
  if(found.length) out.grapes = found.join(', ');

  return out;
}

function saveWineFromForm(editId){
  const g = id => document.getElementById(id).value.trim().replace(/[<>]/g, '');
  const name = g('fName');
  if(!name){ showToast('Inserisci almeno il nome del vino'); return; }
  const wine = {
    id: editId || Date.now(),
    custom: true,
    name,
    producer: g('fProducer'),
    denom: g('fDenom'),
    type: document.getElementById('fType').value,
    region: g('fRegion'),
    vintage: parseInt(g('fVintage')) || null,
    abv: g('fAbv'),
    grapes: g('fGrapes'),
    notes: g('fNotes')
  };
  if(formImg) wine.img = formImg;
  if(editId){
    customWines = customWines.map(x=> x.id===editId ? wine : x);
  } else {
    customWines.push(wine);
  }
  saveCustomWines();
  refreshRegionOptions();
  render();
  showToast(editId ? 'Modifiche salvate' : 'Vino aggiunto');
  openDetail(wine.id);
}

function saveCustomWines(){
  try{
    localStorage.setItem('cantina-custom-wines', JSON.stringify(customWines));
    hasUnexportedChanges = true;
  }catch(e){
    showToast('Memoria piena: impossibile salvare');
  }
}

function deleteCustomWine(id){
  customWines = customWines.filter(x=>x.id!==id);
  delete userData[id];
  saveCustomWines();
  saveUserData();
  refreshRegionOptions();
  render();
  closeDetail();
  showToast('Vino eliminato');
}

function closeDetail(){
  document.getElementById('overlay').classList.remove('open');
}

document.getElementById('overlay').addEventListener('click', e=>{
  if(e.target.id === 'overlay') closeDetail();
});

document.getElementById('searchInput').addEventListener('input', e=>{
  searchTerm = e.target.value;
  render();
});

function showToast(msg){
  const t = document.getElementById('backupToast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=> t.classList.remove('show'), 2200);
}

function exportBackup(silent){
  const blob = new Blob([JSON.stringify({__v:2, userData, customWines}, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `cantina-backup.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  hasUnexportedChanges = false;
  if(!silent) showToast('Backup scaricato');
}

function importBackup(file){
  const reader = new FileReader();
  reader.onload = (e)=>{
    try{
      const parsed = JSON.parse(e.target.result);
      if(parsed && parsed.__v === 2){
        userData = parsed.userData || {};
        customWines = parsed.customWines || [];
      } else {
        userData = parsed;
      }
      localStorage.setItem('cantina-user-data', JSON.stringify(userData));
      localStorage.setItem('cantina-custom-wines', JSON.stringify(customWines));
      refreshRegionOptions();
      hasUnexportedChanges = false;
      render();
      showToast('Backup importato');
    }catch(err){
      showToast('File non valido');
    }
  };
  reader.readAsText(file);
}

document.getElementById('exportBtn').addEventListener('click', ()=>exportBackup(false));
document.getElementById('importBtn').addEventListener('click', ()=>{
  document.getElementById('importFile').click();
});
document.getElementById('importFile').addEventListener('change', (e)=>{
  if(e.target.files && e.target.files[0]){
    importBackup(e.target.files[0]);
    e.target.value = '';
  }
});

// Banner all'apertura: chiede se importare un backup
const importBanner = document.getElementById('importBanner');
importBanner.classList.add('show');
document.getElementById('bannerYes').addEventListener('click', ()=>{
  importBanner.classList.remove('show');
  document.getElementById('importFile').click();
});
document.getElementById('bannerNo').addEventListener('click', ()=>{
  importBanner.classList.remove('show');
});

// Download automatico del backup quando l'app viene chiusa o messa in background,
// solo se ci sono modifiche non ancora esportate.
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState === 'hidden' && hasUnexportedChanges){
    exportBackup(true);
  }
});
window.addEventListener('pagehide', ()=>{
  if(hasUnexportedChanges){
    exportBackup(true);
  }
});

document.getElementById('addWineBtn').addEventListener('click', ()=>openAddForm());

populateTypeChips();
populateRegionSelect();
loadUserData();
</script>
